<!DOCTYPE html>
<html>
<head>
    <title>Crypto Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <h1>Real-Time Crypto Prices</h1>
    
    <ul>
        {% for crypto, prices in crypto_data.items() %}
        <li>
            <strong>{{ crypto | capitalize }}</strong>: {{ prices.usd }} USD
        </li>
        {% endfor %}
    </ul>

    <hr>

    <h2>Historical Price Chart</h2>
    <div id="historical-chart"></div>

    {% if graph_json %}
    <script>
        var plot_json_string = `{{ graph_json | safe }}`;
        var graph = JSON.parse(plot_json_string);
        Plotly.newPlot('historical-chart', graph.data, graph.layout);
    </script>
    {% endif %}

</body>
</html>
